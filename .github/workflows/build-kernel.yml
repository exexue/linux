name: Build MSM8953 Kernel

on:
  workflow_dispatch:
  push:
    branches: [ meizu-m1721 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: meizu-m1721
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu build-essential flex bison libssl-dev libncurses-dev bc python3

      - name: Copy kernel config
        run: |
          cp .config arch/arm64/configs/msm8953_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- msm8953_defconfig

      - name: Compile kernel, dtbs and modules
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image.gz dtbs modules

      - name: Prepare module directory
        run: |
          mkdir -p artifacts/modules
          # 只拷贝 wcn36xx 驱动目录下的所有 .ko 文件
          find drivers/net/wireless/ath/wcn36xx -name "*.ko" -exec cp {} artifacts/modules/ \;
          echo "=== 编译出的模块 ==="
          ls -lh artifacts/modules/

      - name: Upload kernel image and dtb
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/qcom/msm8953-meizu-m1721.dtb

      - name: Upload WiFi module (wcn36xx.ko)
        uses: actions/upload-artifact@v4
        with:
          name: wifi-module
          path: artifacts/modules/*.ko
