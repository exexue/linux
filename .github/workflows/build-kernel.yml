name: Build MSM8953 Kernel + deb

on:
  workflow_dispatch:
  push:
    branches: [ meizu-m1721 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: meizu-m1721
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu build-essential flex bison \
            libssl-dev libncurses-dev bc python3 dpkg-dev fakeroot debhelper \
            libelf-dev dwarves rsync

      - name: Copy kernel config
        run: |
          cp .config arch/arm64/configs/msm8953_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- msm8953_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel and deb packages
        env:
          KDEB_PKGVERSION: "7.1.3-1"
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               -j$(nproc) bindeb-pkg \
               KDEB_BUILD_OPTIONS="nodeps" \
               DPKG_FLAGS="-d"

      - name: List generated deb files
        run: |
          echo "=== 生成的 deb 包 ==="
          ls -lh ../*.deb

      - name: Upload kernel image and dtb
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/qcom/msm8953-meizu-m1721.dtb

      - name: Upload deb packages
        uses: actions/upload-artifact@v4
        with:
          name: kernel-deb
          path: ../*.deb
